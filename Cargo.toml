[workspace]
members = ["crates/*"]

# The app is the workspace root package so that `assets/`, `wix/` and the `[[bin]]`
# paths resolve unchanged — Bevy's default AssetPlugin looks for `assets/` relative to
# CARGO_MANIFEST_DIR. The libraries live under `crates/`.

[package]
name = "exotic-matters"
version = "0.1.0"
edition = "2024"
description = "The plotting and trajectory tool for the TTRPG Exotic Matters"
license = "MIT"
authors = ["Alexader Lowry <zander@zanderlowry.com"]
default-run = "exotic-matters"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
em-foundations = { path = "crates/em-foundations" }
em-sim = { path = "crates/em-sim", features = ["bevy"] }

num-traits = "0.2.18"
scilib = "1.0.0"

bevy = "0.17.2"
bevy_mesh = "0.17"
bevy_egui = "0.38.0"
bevy_ui_text_input = "0.6"
iyes_perf_ui = { git = "https://github.com/mgi388/iyes_perf_ui.git", branch = "bevy-0.17" }
serde = { version = "1.0.215", features = ["derive"] }
toml = "0.8.20"
lazy_static = "1.4.0"
regex = "1.10.3"
url = "2.5.4"
http = "1.3.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
itertools = "0.14.0"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
bitflags = "2"
chrono = "0.4.45"

[dependencies.eframe]
version = "0.33.3"
features = [
    "persistence",
]

# Top-level Cargo.toml
[profile.dev.package.objc2]
debug-assertions = false

[[bin]]
name = "exotic-matters"
path = "src/bin/exotic_matters.rs"

[[bin]]
name = "horizons"
path = "src/bin/horizons.rs"

[[bin]]
name = "migrate-saves"
path = "src/bin/migrate_saves.rs"

[[bin]]
name = "csv-sort"
path = "src/bin/csv_sort.rs"

[dev-dependencies]
em-sim = { path = "crates/em-sim" }
