[package]
name = "lc-identity"
version = "0.1.0"
edition = "2024"
description = "The Lightcone identity broker: upstream providers in, account ids out."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "set-header"] }
maud = { version = "0.27", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime-checked queries, for the reason `web/lc-web` gives: a committed `.sqlx/` that goes
# stale fails the Docker build confusingly, and this schema is small.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Memory-hard by design. The parameters live in the stored PHC string, not here.
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std", "getrandom"] }
jsonwebtoken = "9"
# Key generation and PKCS#8 serialisation. `jsonwebtoken` verifies and signs but does not
# make keys, and a broker that cannot make one cannot start without an operator first finding
# an openssl invocation.
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand_core = "0.6"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
# Only for the loopback exception in `config::is_allowed_return`. Everything else compares
# strings, deliberately; a loopback redirect cannot, because its port is chosen at runtime.
url = "2"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Driving the router directly, without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
