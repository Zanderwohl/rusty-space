[package]
name = "lc-web"
version = "0.1.0"
edition = "2024"
description = "The Lightcone website: landing page, blog, and the loader for the browser build."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br", "timeout", "set-header"] }
maud = { version = "0.27", features = ["axum"] }
grass = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
mime_guess = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# default-fancy is the pure-Rust regex engine. The oniguruma default drags in a C library,
# which would put a C toolchain in the build image for syntax colouring.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rss = "2"
# Runtime-checked queries, not the `query!` macros.
#
# The plan said compile-time checking with a committed `.sqlx/`. That needs `cargo sqlx
# prepare` against a live database whenever a query changes, and a stale `.sqlx` fails the
# Docker build confusingly. For six queries over two tables that is a poor trade: the checking
# buys little and the hermetic build is worth a lot. Revisit if the schema grows.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
# Signing the session cookie. A signed cookie rather than a sessions table: the site already
# serves with the database stopped, and a sign-in that needed it would be the one page that
# does not. See lightcone/docs/16-identity.md.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# Two calls to the identity broker, on the runtime the site already has.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = { version = "8", optional = true }

[features]
default = []
# The SCSS watcher. Development only; absent from the shipped binary, which has nothing to
# watch because its static tree is baked into a read-only image.
watch = ["dep:notify"]
