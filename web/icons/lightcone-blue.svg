<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lightcone</title>
  <defs>
    <!-- Gradients are in the cone's local (unrotated) coordinates -->
    <linearGradient id="fillTop" gradientUnits="userSpaceOnUse" x1="0" y1="-46" x2="0" y2="0">
      <stop offset="0" stop-color="#8FB3F5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C7BE0" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="fillBottom" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="46">
      <stop offset="0" stop-color="#4C7BE0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8FB3F5" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="apexGlow" cx="0" cy="0" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#BFD3FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Local frame: apex at origin, axis vertical, then tilted -30deg -->
  <g transform="translate(64 64) rotate(-30)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Nappe bodies (translucent fill) -->
    <path d="M0 0 L-33.37 28.875 A36 12.6 0 1 0 33.37 28.875 Z" fill="url(#fillBottom)"/>
    <path d="M0 0 L-33.37 -28.875 A36 12.6 0 1 1 33.37 -28.875 Z" fill="url(#fillTop)"/>

    <!-- Top opening: slightly deeper tint to read as the inside surface -->
    <ellipse cx="0" cy="-33.6" rx="36" ry="12.6" fill="#3F6FD6" fill-opacity="0.18"/>

    <!-- Back halves of cross-section circles, seen through the material -->
    <g stroke="#2F5FC4" stroke-opacity="0.35" stroke-width="1.4">
      <path d="M-11.123 -9.625 A12 4.2 0 1 1 11.123 -9.625"/>
      <path d="M-22.247 -19.25 A24 8.4 0 1 1 22.247 -19.25"/>
      <path d="M-11.123 9.625 A12 4.2 0 0 1 11.123 9.625"/>
      <path d="M-22.247 19.25 A24 8.4 0 0 1 22.247 19.25"/>
      <path d="M-33.37 28.875 A36 12.6 0 0 1 33.37 28.875"/>
    </g>

    <!-- Front halves of cross-section circles -->
    <g stroke="#2F5FC4" stroke-opacity="0.75" stroke-width="1.6">
      <path d="M-11.123 -9.625 A12 4.2 0 0 0 11.123 -9.625"/>
      <path d="M-22.247 -19.25 A24 8.4 0 0 0 22.247 -19.25"/>
      <path d="M-11.123 9.625 A12 4.2 0 1 0 11.123 9.625"/>
      <path d="M-22.247 19.25 A24 8.4 0 1 0 22.247 19.25"/>
    </g>

    <!-- Silhouettes and rims -->
    <g stroke="#2A56C6" stroke-width="2.6">
      <path d="M0 0 L-33.37 28.875 A36 12.6 0 1 0 33.37 28.875 Z"/>
      <path d="M0 0 L-33.37 -28.875 A36 12.6 0 1 1 33.37 -28.875 Z"/>
      <ellipse cx="0" cy="-33.6" rx="36" ry="12.6"/>
    </g>

    <!-- The event at the apex -->
    <circle cx="0" cy="0" r="7" fill="url(#apexGlow)"/>
  </g>
</svg>
