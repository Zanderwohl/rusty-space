[package]
name = "em-render"
version = "0.1.0"
edition = "2024"
description = "Reusable Bevy rendering for orbital scenes. Knows no game or TTRPG rule."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
em-foundations = { path = "../em-foundations" }
em-sim = { path = "../em-sim", features = ["bevy"] }
# What this crate uses and nothing more; the app decides the rest. See AGENTS.md, "Bevy features".
bevy = { version = "0.19.1", default-features = false, features = ["std", "bevy_pbr", "bevy_post_process"] }
bevy_mesh = "0.19"
