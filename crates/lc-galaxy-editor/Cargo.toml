[package]
name = "lc-galaxy-editor"
version = "0.1.0"
edition = "2024"
description = "Galaxy Forge: the native editor for the Lightcone galaxy. Never shipped."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
lc-galaxy = { path = "../lc-galaxy" }
lc-world = { path = "../lc-world", default-features = false }
bevy = "0.19.1"
bevy_egui = "0.42.0"
glam = "0.32"
em-ui = { path = "../em-ui", features = ["egui"] }
em-plot = { path = "../em-plot", features = ["raster"] }
rfd = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[[bin]]
name = "lc-galaxy-editor"
path = "src/main.rs"
