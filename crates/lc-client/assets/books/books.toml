# The shelf.
#
# Hand-maintained: `cargo run -p lc-books --example shelf -- <dir> --toml` writes a first draft
# from the files themselves, and then a person fixes what the files cannot know. The `year` is
# always one of those — an epub states the day its transcription was posted, which for this
# shelf is between 1993 and 2008 for books written in the 1870s and 1880s.
#
# `id` is stable and `file` is not. Two of the files below are named after a Gutenberg number
# and two have lost a colon from their title; nothing reads a name to find out what a book is.
#
# Step 4 in lightcone/docs/19-library.md moves this file to the server, which sends it. Its
# shape does not change when it moves.

[[book]]
id      = "a-princess-of-mars"
title   = "A Princess of Mars"
authors = [{ name = "Edgar Rice Burroughs", sort = "Burroughs, Edgar Rice" }]
year    = 1912
subjects = ["Science fiction", "Mars (Planet) -- Fiction", "Princesses -- Fiction", "Carter, John (Fictitious character) -- Fiction", "Dejah Thoris (Fictitious character) -- Fiction"]
file    = "A Princess of Mars.epub"

[[book]]
id      = "adventures-of-huckleberry-finn"
title   = "Adventures of Huckleberry Finn"
authors = [{ name = "Mark Twain", sort = "Twain, Mark" }]
year    = 1884
subjects = ["Humorous stories", "Bildungsromans", "Boys -- Fiction", "Male friendship -- Fiction", "Adventure stories", "Missouri -- Fiction", "Race relations -- Fiction", "Runaway children -- Fiction", "Finn, Huckleberry (Fictitious character) -- Fiction", "Fugitive slaves -- Fiction", "Mississippi River -- Fiction"]
file    = "Adventures of Huckleberry Finn.epub"

[[book]]
id      = "the-adventures-of-tom-sawyer-complete"
title   = "The Adventures of Tom Sawyer, Complete"
authors = [{ name = "Mark Twain", sort = "Twain, Mark" }]
year    = 1876
subjects = ["Humorous stories", "Bildungsromans", "Boys -- Fiction", "Male friendship -- Fiction", "Adventure stories", "Missouri -- Fiction", "Sawyer, Tom (Fictitious character) -- Fiction", "Child witnesses -- Fiction", "Runaway children -- Fiction", "Mississippi River Valley -- Fiction"]
file    = "The Adventures of Tom Sawyer Complete.epub"

[[book]]
id      = "the-gilded-age"
title   = "The Gilded Age: A Tale of Today"
authors = [{ name = "Mark Twain", sort = "Twain, Mark" }, { name = "Charles Dudley Warner", sort = "Warner, Charles Dudley" }]
year    = 1873
subjects = ["Satire", "Political fiction", "Washington (D.C.) -- Fiction", "Legislators -- Fiction", "Speculation -- Fiction", "Political corruption -- Fiction", "Businessmen -- Fiction"]
file    = "The Gilded Age A Tale of Today.epub"

[[book]]
id      = "twenty-thousand-leagues-under-the-seas"
title   = "Twenty Thousand Leagues Under the Seas: An Underwater Tour of the World"
authors = [{ name = "Jules Verne", sort = "Verne, Jules" }]
year    = 1870
subjects = ["Science fiction", "Submarines (Ships) -- Fiction", "Sea stories", "Adventure stories", "Underwater exploration -- Fiction"]
file    = "pg2488-images-3.epub"

[[book]]
id      = "the-strange-case-of-dr-jekyll-and-mr-hyde"
title   = "The Strange Case of Dr. Jekyll and Mr. Hyde"
authors = [{ name = "Robert Louis Stevenson", sort = "Stevenson, Robert Louis" }]
year    = 1886
subjects = ["Science fiction", "Horror tales", "London (England) -- Fiction", "Physicians -- Fiction", "Psychological fiction", "Self-experimentation in medicine -- Fiction", "Multiple personality -- Fiction"]
file    = "pg43-images-3.epub"

