[package]
name = "lc-catchup"
version = "0.1.0"
edition = "2024"
description = "Catching a Lightcone client up on what landed on its craft before the retention cutoff, from the store alone."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

# The store and the wire, and nothing of the shard: this is meant to become a service of its own,
# reading old deliveries and events while the shard runs the world.
[dependencies]
lc-proto = { path = "../lc-proto" }
lc-store = { path = "../lc-store" }
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
