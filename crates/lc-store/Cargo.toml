[package]
name = "lc-store"
version = "0.1.0"
edition = "2024"
description = "The Lightcone event store: schema, causality and the light-cone cursor."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
lc-spacetime = { path = "../lc-spacetime" }
glam = "0.32"
tokio-postgres = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = ["postgres"]
postgres = ["dep:tokio-postgres", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
