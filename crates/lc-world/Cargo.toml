[package]
name = "lc-world"
version = "0.1.0"
edition = "2024"
description = "Game world model: populations, stellar photometry and occultation. Engine-agnostic."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
em-foundations = { path = "../em-foundations" }
em-spectra = { path = "../em-spectra" }
lc-spacetime = { path = "../lc-spacetime" }
# The wire types, for the conversions in `navigation`. Serde and postcard and nothing else,
# so this costs the browser build nothing it was not already paying.
lc-proto = { path = "../lc-proto" }
# No default features: em-sim pulls in bevy_ecs behind its `bevy` feature and the server
# must not link an engine.
em-sim = { path = "../em-sim", default-features = false }
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1.0.215", features = ["derive"] }
csv = { version = "1", optional = true }

# Offline tooling. Native only, and the only program in the tree that reads a CSV.
[[bin]]
name = "skypack"
path = "src/bin/skypack.rs"
required-features = ["hyg"]

[features]
default = ["hyg"]
# The HYG importer, and the CSV reader it needs. Off for a world built from an authored
# galaxy, which is what the shipped game uses.
hyg = ["dep:csv"]

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
