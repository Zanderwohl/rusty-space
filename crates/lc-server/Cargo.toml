[package]
name = "lc-server"
version = "0.1.0"
edition = "2024"
description = "The Lightcone server: the tick loop, intent validation and the single send gate."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
lc-books = { path = "../lc-books" }
lc-proto = { path = "../lc-proto" }
lc-spacetime = { path = "../lc-spacetime" }
lc-world = { path = "../lc-world", default-features = false }
# The band a stored photometric sample was taken in.
em-foundations = { path = "../em-foundations" }
em-spectra = { path = "../em-spectra" }
lc-store = { path = "../lc-store" }
glam = "0.32"
# Verifying game tickets. The server depends on a JWT library and a public key, never on the
# identity broker: see lightcone/docs/16-identity.md.
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Exact: a report or a knowledge page that moved a bearing by one place in the last digit
# would be a different measurement, and deduplication is by the bits.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
tokio-tungstenite = "0.24"
# The administration console reads  over this. A format rather than a shared crate:
# the console is in another workspace and may not link a game crate. See src/status.rs.
ron = "0.10"
# One read-only route for the administration console, on its own port. See src/admin.rs.
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# One GET at boot, for the broker's published keys. Blocking, before the runtime matters, and
# not worth an async HTTP stack.
ureq = { version = "2", features = ["json", "tls"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "lightcone-server"
path = "src/bin/lightcone-server.rs"
