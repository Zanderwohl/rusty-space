[package]
name = "lc-proto"
version = "0.1.0"
edition = "2024"
description = "The Lightcone wire protocol: intents in, cleared sightings out."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
