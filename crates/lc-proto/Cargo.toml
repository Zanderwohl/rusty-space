[package]
name = "lc-proto"
version = "0.1.0"
edition = "2024"
description = "The Lightcone wire protocol: intents in, cleared sightings out."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
# A transmission's payload is JSON, and `redact` is the one place this crate reads one: the rule a
# shard and a catch-up both apply. Exact, as the shard's is, so a re-serialized payload is the same.
serde_json = { version = "1", features = ["float_roundtrip"] }
