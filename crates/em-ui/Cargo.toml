[package]
name = "em-ui"
version = "0.1.0"
edition = "2024"
description = "Reusable Bevy-native menu widgets. Knows no game or TTRPG rule."
license = "MIT"
authors = ["Alexander Lowry <zander@zanderlowry.com>"]

[dependencies]
# What this crate uses and nothing more; the app decides the rest. See AGENTS.md, "Bevy features".
bevy = { version = "0.19.1", default-features = false, features = ["std", "bevy_ui", "bevy_input_focus"] }
