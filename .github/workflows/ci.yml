name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The workspace builds clean today. Anything new that warns is a bug worth
  # seeing before it is merged, not after it has spread.
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Bevy needs these to link on Linux; the library crates do not, which is
      # what the no-default-features builds below are checking.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev

      - name: Test
        run: cargo test --workspace

      # The point of the split: neither library crate may reach for Bevy.
      - name: em-foundations is engine-free
        run: |
          if cargo tree -p em-foundations | grep -qi bevy; then
            echo "em-foundations depends on bevy" >&2
            exit 1
          fi
      - name: Libraries build standalone
        run: |
          cargo build -p em-foundations --no-default-features
          cargo build -p em-sim --no-default-features

      # The other direction of the split: Lightcone is a separate product on the
      # same shared crates, and Exotic Matters must never reach into it.
      - name: Exotic Matters does not depend on Lightcone
        run: |
          if cargo tree -p exotic-matters | grep -qE '^[[:space:]]*lc-'; then
            echo "exotic-matters depends on an lc- crate" >&2
            cargo tree -p exotic-matters | grep -E '^[[:space:]]*lc-' >&2
            exit 1
          fi

  # The browser build.
  #
  # A PR gets the cheap half: does it compile for wasm, and is every shader its materials
  # name actually in the asset tree. The expensive half -- a fat-LTO release build, wasm-opt,
  # and the staged artifact -- runs on master, because it is minutes and a PR does not need
  # the bytes.
  wasm:
    runs-on: ubuntu-latest
    # **An env `RUSTFLAGS` replaces `.cargo/config.toml`'s, it does not add to it.** The config
    # names `getrandom`'s browser backend for this target alone, and the workspace's `-D warnings`
    # was quietly dropping it — so every browser check failed on `getrandom` refusing to build for
    # wasm, whatever the change. Both belong here, together, or neither reaches the compiler.
    env:
      RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev binaryen brotli

      # Every shader lc-client's materials name must exist. This is a runtime 404 in a
      # browser otherwise, discovered long after the build reported success.
      - name: Shaders are all present
        run: tools/check-shaders.sh

      - name: The client compiles for the browser
        run: |
          cargo check -p lc-client --bin lightcone_web \
            --target wasm32-unknown-unknown --no-default-features

      # The browser build must not contain a CSV reader: there is no filesystem to read from,
      # and the catalogue ships as a packed chunk instead.
      - name: No CSV reader in the browser build
        run: |
          if cargo tree -p lc-client --no-default-features \
               --target wasm32-unknown-unknown | grep -qE '^[[:space:]]*csv '; then
            echo "the browser build links a CSV reader" >&2
            exit 1
          fi

      # The CLI has to match the crate the client links, so take the version from the lock
      # file rather than pinning it twice and letting the two drift.
      - name: Install wasm-bindgen-cli
        if: github.ref == 'refs/heads/master'
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | python3 -c "import json,sys;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='wasm-bindgen'))")
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the artifact
        if: github.ref == 'refs/heads/master'
        run: tools/build-wasm.sh

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: lightcone-web
          path: target/web/
          retention-days: 14

  # The website is its own workspace with its own lockfile, which is what makes its
  # version independent of the game's. It shares no code with either product, so a
  # path dependency reaching back into crates/ is the thing to catch.
  #
  # The identity broker and the administration console. One workspace, for the same reason the
  # site has its own, and it must stay out of both products' dependency trees. See
  # lightcone/docs/16-identity.md.
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    # The console's tests need one. They skip without it, so that a developer's machine does
    # not have to have PostgreSQL — which makes it exactly the kind of coverage that quietly
    # stops running. Here it is not optional.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      LC_ADMIN_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/lc-admin/package-lock.json

      - name: The broker is a separate workspace
        run: |
          if grep -rn 'path = "\.\./\.\./\(crates\|web\)' */Cargo.toml; then
            echo "the broker has a path dependency on a product crate" >&2
            exit 1
          fi

      # The console's TypeScript, which the container build compiles in a stage of its own.
      # `tsc --noEmit` is the half that matters here: a type error fails the build rather than
      # reaching a browser as a runtime one. The bundle has to exist too, because the console
      # reads it at boot and a test asserts that its assets load.
      - name: The console's TypeScript
        working-directory: auth/lc-admin
        run: npm ci && npm run build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

  # Images are built on the `rocinante` docker context, not here. See
  # lightcone/docs/14-hosting.md.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: The site is a separate workspace
        run: |
          if grep -rn 'path = "\.\./\.\./crates' */Cargo.toml; then
            echo "the site has a path dependency on a game crate" >&2
            exit 1
          fi

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      # The stylesheet is compiled at boot, so a syntax error in it is a failed
      # deploy rather than a failed build. Compiling it here moves that left.
      - name: The stylesheet compiles
        run: cargo run --quiet --bin lc-web -- --check-styles
